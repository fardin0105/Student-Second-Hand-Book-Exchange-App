{% extends "base.html" %}
{% block content %}
<section class="hero">
  <div>
  <h1>Find your next textbook from a student, not a shop.</h1>
  <p>Everyone can sell, buy or exchange used books here. Search below or <a href="{{ url_for('sell') }}">list a book of your own</a>.</p>
  </div>
  <img class="hero-logo" src="{{ url_for('static', filename='logo.png') }}" alt="SHBE logo: an open book with two exchange arrows" width="150" height="150">
</section>
<form id="filters" class="filters" action="{{ url_for('index') }}" method="get" role="search">
  <label>Title, author or subject
    <input type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="e.g. Database" maxlength="80"></label>
  <label>Subject
    <select name="subject"><option value="">All subjects</option>
      {% for s in SUBJECTS %}<option {{ 'selected' if request.args.get('subject') == s }}>{{ s }}</option>{% endfor %}</select></label>
  <label>Condition
    <select name="condition"><option value="">Any</option>
      {% for c in CONDITIONS %}<option {{ 'selected' if request.args.get('condition') == c }}>{{ c }}</option>{% endfor %}</select></label>
  <label>Offer
    <select name="offer"><option value="">Sale or exchange</option>
      <option value="sell">For sale</option><option value="exchange">For exchange</option></select></label>
  <label>Max price (RM)
    <input type="number" name="max_price" min="0" step="1" placeholder="50"></label>
  <button class="btn" type="submit">Search</button>
</form>
<div id="results" class="books" aria-live="polite">{% include "_cards.html" %}</div>
{% endblock %}
