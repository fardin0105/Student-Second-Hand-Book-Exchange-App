{% extends "base.html" %}
{% block title %}{{ 'Edit listing' if book else 'List a book' }} &middot; {% endblock %}
{% block content %}
{% set v = request.form if request.method == 'POST' else (book or {}) %}
<form class="card narrow" method="post" enctype="multipart/form-data">
  <h1>{{ 'Edit your listing' if book else 'Sell or exchange a book' }}</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Book title <input name="title" required maxlength="120" value="{{ v.get('title', '') }}"></label>
  <label>Author <input name="author" required maxlength="80" value="{{ v.get('author', '') }}"></label>
  <label>Subject
    <select name="subject" required>{% for s in SUBJECTS %}<option {{ 'selected' if v.get('subject') == s }}>{{ s }}</option>{% endfor %}</select></label>
  <fieldset><legend>I want to</legend>
    <label class="inline"><input type="radio" name="offer" value="sell" {{ 'checked' if v.get('offer', 'sell') == 'sell' }}> Sell</label>
    <label class="inline"><input type="radio" name="offer" value="exchange" {{ 'checked' if v.get('offer') == 'exchange' }}> Exchange</label>
  </fieldset>
  <label>Price (RM) <input type="number" id="price" name="price" min="0" max="1000" step="0.5" value="{{ v.get('price') or '' }}"></label>
  <label>Condition
    <select name="condition" required>{% for c in CONDITIONS %}<option {{ 'selected' if v.get('cond', v.get('condition')) == c }}>{{ c }}</option>{% endfor %}</select></label>
  <label>Photo (optional) <input type="file" id="photo" name="photo" accept="image/*"></label>
  <img id="preview" class="preview" alt="Preview of the chosen photo" {% if book and book.photo %}src="{{ url_for('static', filename='uploads/' ~ book.photo) }}"{% else %}hidden{% endif %}>
  <label>Note for buyers <textarea name="note" rows="3" maxlength="300" placeholder="Edition, where to meet, what you would swap for...">{{ v.get('note') or '' }}</textarea></label>
  <button class="btn" type="submit">Save listing</button>
</form>
{% endblock %}
